name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Trusted publishing (OIDC, no token) requires a recent npm.
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Publish in dependency order: core -> memory -> map.
      # Authentication is tokenless via npm trusted publishing (configured per
      # package on npmjs.com against this repo + workflow). No NPM_TOKEN secret.
      # --access public is required for scoped packages; provenance is attached
      # automatically under trusted publishing.
      - name: Publish @repomem/core
        run: npm publish -w @repomem/core --access public

      - name: Publish @repomem/memory
        run: npm publish -w @repomem/memory --access public

      - name: Publish @repomem/map
        run: npm publish -w @repomem/map --access public
