name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Trusted publishing (OIDC, no token) requires a recent npm.
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Publish in dependency order: core -> memory -> map -> cli.
      #
      # Each package is published only when the version in its package.json is
      # not already on npm. This makes releases per-package: bump just the
      # package(s) you changed, push a `v*` tag, and the workflow publishes only
      # those — packages whose version already exists are skipped (npm never
      # lets you republish an existing version). The fixed order means that when
      # several change together, dependencies go out before their dependents.
      #
      # Authentication is tokenless via npm trusted publishing (configured per
      # package on npmjs.com against this repo + workflow). No NPM_TOKEN secret.
      # --access public is required for scoped packages; provenance is attached
      # automatically under trusted publishing.
      - name: Publish changed packages
        run: |
          set -euo pipefail
          publish_if_new() {
            local dir="$1"
            local name version
            name="$(node -p "require('./packages/${dir}/package.json').name")"
            version="$(node -p "require('./packages/${dir}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "✓ ${name}@${version} already published — skipping."
            else
              echo "→ Publishing ${name}@${version}…"
              npm publish -w "${name}" --access public
            fi
          }
          # Dependency order: core -> memory -> map -> cli.
          publish_if_new core
          publish_if_new memory
          publish_if_new map
          publish_if_new installer
